<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SakuraReel: original anime made with AI</title>
<meta name="description" content="Watch original AI-made anime for free. Support the creator to download episodes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#130f24;--surf:#1d1836;--line:#2e2750;--text:#f3f0ff;--muted:#a9a2cc;--acc:#ff5c8a;--r:14px}
@media(prefers-color-scheme:light){:root{--bg:#faf7ff;--surf:#fff;--line:#e4dcf5;--text:#1b1533;--muted:#6a6290;--acc:#d6245e}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 Figtree,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
h1,h2,.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-size:1.4rem;font-weight:800}.logo b{color:var(--acc)}
nav{display:flex;gap:18px;font-weight:600;font-size:.95rem}nav a{color:var(--muted)}nav a:hover{color:var(--text)}
main{flex:1;padding:0 5vw 48px}
.hero{margin:24px 0 40px;border-radius:24px;padding:clamp(28px,6vw,72px);background:linear-gradient(135deg,var(--a),var(--b));color:#fff;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,6rem);line-height:.95;font-weight:800;max-width:11ch}
.hero p{max-width:52ch;opacity:.92}
.btn{display:inline-block;background:var(--acc);color:#fff;font-weight:600;padding:12px 22px;border-radius:999px;border:0;cursor:pointer;width:fit-content}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--text)}
h2{font-size:1.5rem;margin:32px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block}
.card:hover{border-color:var(--acc)}
.card .art,.card img{aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:linear-gradient(135deg,var(--a),var(--b))}
.meta{padding:12px 14px;display:grid;gap:2px}.meta span{color:var(--muted);font-size:.9rem}
.player{aspect-ratio:16/9;width:100%;border-radius:var(--r);background:#000;border:0;display:grid;place-items:center;color:#cfc9ee;text-align:center;padding:20px}
.watch{display:grid;gap:24px;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);margin-top:24px}
@media(max-width:860px){.watch{grid-template-columns:1fr}}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.side{display:grid;gap:14px;align-content:start}
input[type=search]{width:100%;max-width:420px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--text);font:inherit;margin-top:24px}
.empty{color:var(--muted);padding:24px 0}
footer{border-top:1px solid var(--line);padding:20px 5vw;color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/">Sakura<b>Reel</b></a>
  <nav><a href="#/">Home</a><a href="#/browse">Browse</a></nav>
</header>
<main id="app"></main>
<footer>All series are original works made with AI tools. SakuraReel is not affiliated with Crunchyroll or any other studio.</footer>
<script>
// Edit this file to manage your site. No build step needed.

// youtube: video ID of your upload (unlisted or public)
// video:   or a direct .mp4 URL (e.g. Cloudflare R2)
// download: your Gumroad / Ko-fi / Stripe link for the paid file
window.EPISODES = [
  { id: "Big-boss-season-20", series: "Big Boss", ep: 65, title: "Big Boss ep 65",
    desc: "By Salmon Bhai",
    c: ["#ff5c8a", "#3a1c71"], youtube: "", video: "", download: "", thumb: "" },
];
</script>
<script>
(() => {
  const E = window.EPISODES, S = window.SITE, app = document.getElementById("app");
  const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const grad = e => `--a:${esc(e.c[0])};--b:${esc(e.c[1])}`;
  const card = e => `<a class="card" href="#/watch/${esc(e.id)}" style="${grad(e)}">
    ${e.thumb ? `<img src="${esc(e.thumb)}" alt="" loading="lazy">` : `<div class="art"></div>`}
    <div class="meta"><strong>${esc(e.series)}</strong><span>Episode ${e.ep}: ${esc(e.title)}</span></div></a>`;

  function home() {
    const f = E[0];
    app.innerHTML = `<section class="hero" style="${grad(f)}">
      <h1>${esc(f.series)}</h1><p>${esc(f.desc)}</p>
      <a class="btn" href="#/watch/${esc(f.id)}">Watch episode ${f.ep}</a></section>
      <h2>Latest episodes</h2><div class="grid">${E.map(card).join("")}</div>`;
  }

  function browse() {
    app.innerHTML = `<input type="search" id="q" placeholder="Search series or episodes" aria-label="Search"><div class="grid" id="list" style="margin-top:24px"></div>`;
    const list = document.getElementById("list"), q = document.getElementById("q");
    const draw = () => {
      const t = q.value.toLowerCase();
      const r = E.filter(e => (e.series + " " + e.title).toLowerCase().includes(t));
      list.innerHTML = r.length ? r.map(card).join("") : `<p class="empty">No matches. Try another title.</p>`;
    };
    q.oninput = draw; draw();
  }

  function watch(id) {
    const e = E.find(x => x.id === id);
    if (!e) { app.innerHTML = `<p class="empty">Episode not found. <a href="#/browse">Browse all episodes</a></p>`; return; }
    document.title = `${e.series} Episode ${e.ep}: SakuraReel`;
    const player = e.youtube
      ? `<iframe class="player" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(e.youtube)}" title="${esc(e.title)}" allowfullscreen loading="lazy"></iframe>`
      : e.video
      ? `<video class="player" controls preload="metadata" src="${esc(e.video)}"></video>`
      : `<div class="player">This episode isn't uploaded yet. Add a youtube ID or video URL in data.js.</div>`;
    const more = E.filter(x => x.series === e.series && x.id !== e.id);
    app.innerHTML = `<div class="watch"><div>${player}
      <h1 style="margin-top:20px;font-size:1.8rem">${esc(e.series)}, Episode ${e.ep}: ${esc(e.title)}</h1>
      <p style="margin:8px 0"><span class="badge">Made with AI</span></p><p>${esc(e.desc)}</p>
      <div class="actions">
        ${e.download ? `<a class="btn" href="${esc(e.download)}" target="_blank" rel="noopener">Download episode</a>` : ""}</div></div>
      <aside class="side"><h2 style="margin:0">${more.length ? "More from this series" : "Keep watching"}</h2>
      ${(more.length ? more : E.filter(x => x.id !== e.id)).slice(0, 4).map(card).join("")}</aside></div>`;
  }

  function route() {
    const [, page, id] = location.hash.split("/");
    document.title = "SakuraReel: original anime made with AI";
    if (page === "watch") watch(id); else if (page === "browse") browse(); else home();
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  try { route(); } catch (err) { app.innerHTML = `<p class="empty">Something broke: ${esc(err.message)}</p>`; }
})();
</script>
</body>
</html>
